line-length = 120
target-version = "py312"

# Conservador a proposito: en Fase 0 el CI es red de seguridad, no cleanup masivo.
# Solo bugs reales: errores de sintaxis (E9) y pyflakes de logica
# (F63 asserts/comparaciones, F7 sentencias mal ubicadas, F82 nombres indefinidos).
# Ampliar a F401/imports, I (isort), UP... a medida que se limpia el codigo.
[lint]
select = ["E9", "F63", "F7", "F82"]

exclude = ["alembic/versions"]

[lint.per-file-ignores]
# Los modelos usan forward-refs en string (Mapped["SKU"]) que SQLAlchemy
# resuelve en runtime; ruff los ve como nombres indefinidos (falso positivo).
"app/models/*" = ["F821"]
