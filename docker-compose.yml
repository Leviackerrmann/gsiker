services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comprasuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compraspass}
      POSTGRES_DB: ${POSTGRES_DB:-minisapdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comprasuser} -d ${POSTGRES_DB:-minisapdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-comprasuser}:${POSTGRES_PASSWORD:-compraspass}@db:5432/${POSTGRES_DB:-minisapdb}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
