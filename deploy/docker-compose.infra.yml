# Capa COMPARTIDA de Nébula (no se duplica en blue/green).
# Proyecto compose: nebula-infra
#   - db      : PostgreSQL único (BD compartida por blue y green)  -> red nebula_net
#   - router  : nginx en el puerto 80, punto de switch blue/green  -> network_mode host
#   - telegram: bot singleton (perfil "telegram"), usa la imagen del backend activo
#
# El .env se toma de ~/nebula/shared/.env (symlinkeado como ./.env en ~/nebula/infra).
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comprasuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compraspass}
      POSTGRES_DB: ${POSTGRES_DB:-minisapdb}
      APP_DB_USER: ${APP_DB_USER:-nebula_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-nebula_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - nebula_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comprasuser} -d ${POSTGRES_DB:-minisapdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  router:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./router/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados Let's Encrypt y webroot del challenge ACME (para HTTPS).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

  telegram:
    image: nebula-backend:live
    profiles: ["telegram"]
    command: ["python", "-m", "app.telegram_bot"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-nebula_app}:${APP_DB_PASSWORD:-nebula_app_dev}@db:5432/${POSTGRES_DB:-minisapdb}
    networks:
      - nebula_net
    restart: unless-stopped

  # Respaldos automáticos de Postgres (pg_dump comprimido + retención).
  # No corre por defecto; se activa con:  docker compose --profile backup up -d db-backup
  db-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comprasuser}
      POSTGRES_DB: ${POSTGRES_DB:-minisapdb}
      PGPASSWORD: ${POSTGRES_PASSWORD:-compraspass}
      DB_HOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    networks:
      - nebula_net
    entrypoint: ["sh", "-c", "while true; do /usr/local/bin/backup.sh || echo '[backup] fallo, reintenta luego'; sleep \"${BACKUP_INTERVAL_SECONDS:-86400}\"; done"]
    restart: unless-stopped

networks:
  nebula_net:
    external: true

volumes:
  pgdata:
