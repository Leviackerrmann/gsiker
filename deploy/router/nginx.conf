# Router blue/green de Nébula. Corre en el contenedor `router` (network_mode host)
# escuchando el puerto 80. nebula_ctl.sh reescribe por `sed` las DOS líneas marcadas
# (# NEBULA_FRONT / # NEBULA_BACK) para apuntar al color activo, y recarga nginx.
#
# Arranca con 9999 (placeholder = "ningún color activo") para que el primer deploy
# bootstrapee a blue.
upstream nebula_front { server 127.0.0.1:9999; }  # NEBULA_FRONT
upstream nebula_back  { server 127.0.0.1:9999; }  # NEBULA_BACK

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    # API -> backend del color activo
    location /api/ {
        proxy_pass http://nebula_back;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Todo lo demás (SPA) -> frontend del color activo
    location / {
        proxy_pass http://nebula_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
