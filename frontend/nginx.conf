server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de contenido (index-AbC123.js): el nombre cambia si cambia
    # el contenido, así que se pueden cachear "para siempre" sin riesgo de quedar viejos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
        # El HTML NUNCA se cachea: siempre revalida, para que tras un deploy el
        # navegador cargue las referencias a los assets nuevos (sin Ctrl+Shift+R).
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
}
