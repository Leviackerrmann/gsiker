<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesi&oacute;n - Sistema de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="icon-circle">
                    <i class="bi bi-clipboard2-check"></i>
                </div>
                <h2>Sistema de Solicitudes de Compra</h2>
                <p>Ingrese sus credenciales para acceder</p>
            </div>

            {% if error %}
            <div class="flash-msg flash-error mb-4">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('main.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group mb-4">
                    <label>Correo Electr&oacute;nico</label>
                    <input type="email" class="form-input" name="email" placeholder="usuario@empresa.com" required>
                </div>
                <div class="form-group mb-4">
                    <label>Contrase&ntilde;a</label>
                    <input type="password" class="form-input" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesi&oacute;n
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
